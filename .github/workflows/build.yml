name: Build & Release Android-Use APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v3
      - name: Build
        working-directory: android-agent
        run: |
          GRADLE_VERSION=8.11.1
          mkdir -p gradle/wrapper
          curl -sL https://raw.githubusercontent.com/gradle/gradle/v${GRADLE_VERSION}/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
          curl -sL https://raw.githubusercontent.com/gradle/gradle/v${GRADLE_VERSION}/gradlew -o gradlew
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace --no-daemon 2>&1
          mkdir -p release-assets
          cp app/build/outputs/apk/release/*.apk release-assets/Android-Use-v3.1.0.apk
          cd release-assets && sha256sum *.apk > SHA256SUMS.txt && ls -lh
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-use-apk
          path: android-agent/release-assets/*
          if-no-files-found: warn
      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.1.0
          name: Android-Use v3.1.0
          token: ${{ secrets.PAT_TOKEN }}
          body: |
            # Android-Use v3.1.0
            ## What's New
            - **Professional system prompt** — inspired by Minitap mobile-use Cortex architecture
            - **Clean consumer UI** — no internal messages (observation, model response) shown to users
            - **User-friendly action cards** — "Opened WhatsApp" instead of "android.launch_app"
            - **Faster agent loop** — reduced model retries, post-action settle delay, vision optimization
            - **Background execution** — foreground service keeps agent alive like Spotify
            - **Pulsing status indicator** — animated working state
            - **Empty state** — helpful placeholder when no tasks run yet
            
            ## Installation
            1. Download Android-Use-v3.1.0.apk
            2. Settings > Security > Enable install from browser/source
            3. Install the APK
            4. Open app > Enable Accessibility > Enter your API details
            
            ## Compatibility
            - Android 9+ (minSdk 28), optimized for Android 15 (targetSdk 35)
            - Works on all Android devices with Accessibility services
          files: android-agent/release-assets/*
          draft: false
          prerelease: false
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs
          path: android-agent/app/build/
          if-no-files-found: ignore
