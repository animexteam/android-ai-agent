name: Build & Release Android-Use APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v3
      - name: Build
        working-directory: android-agent
        run: |
          GRADLE_VERSION=8.11.1
          mkdir -p gradle/wrapper
          curl -sL https://raw.githubusercontent.com/gradle/gradle/v${GRADLE_VERSION}/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
          curl -sL https://raw.githubusercontent.com/gradle/gradle/v${GRADLE_VERSION}/gradlew -o gradlew
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace --no-daemon 2>&1
          mkdir -p release-assets
          cp app/build/outputs/apk/release/*.apk release-assets/Android-Use-v4.1.0.apk
          cd release-assets && sha256sum *.apk > SHA256SUMS.txt && ls -lh
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-use-apk
          path: android-agent/release-assets/*
          if-no-files-found: warn
      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.1.0
          name: Android-Use v4.1.0
          token: ${{ secrets.PAT_TOKEN }}
          body: |
            # Android-Use v4.1.0 — AGI-Level Agent
            ## What's New
            - **Chat responses visible** — Agent shows responses in chat UI ("Hello, how can I help?")
            - **Memory fix** — No more wrong action repetition from old memories
            - **Number typing fix** — Exact text verification after typing (786687 stays 786687)
            - **Anti-loop system** — Never closes/reopens apps, detects loops in 3 actions
            - **Voice input** — Mic button for speech-to-text
            - **Gemini-style UI** — Clean dark theme, chat bubbles, modern input bar
            - **Floating assistant ball** — Draggable overlay (enable in Settings > Apps > Special access)
            - **Default assistant** — Set Android-Use as your phone assistant (long-press home)
            - **Faster agent loop** — Adaptive settle times, reduced history for speed
            - **AGI-level prompt** — Manus.im inspired instructions for complex continuous tasks
            
            ## Bug Fixes
            - Fixed: Agent repeating past actions (e.g., sending Hello twice from memory)
            - Fixed: Number typing inaccuracy (786687 → 7768867)
            - Fixed: Chat responses not shown in UI
            - Fixed: Speed inconsistency (slow/fast alternation)
            - Fixed: App close/reopen loops
            
            ## Installation
            1. Download Android-Use-v4.1.0.apk
            2. Settings > Security > Enable install from browser/source
            3. Install the APK
            4. Open app > Enable Accessibility > Enter your API details
            5. (Optional) Set as default assistant: Settings > Apps > Default Digital Assistant
            6. (Optional) Enable overlay: Settings > Apps > Android-Use > Special access > Display over other apps
            
            ## Compatibility
            - Android 9+ (minSdk 28), optimized for Android 15 (targetSdk 35)
          files: android-agent/release-assets/*
          draft: false
          prerelease: false
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs
          path: android-agent/app/build/
          if-no-files-found: ignore
