name: Build & Release Android-Use APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v3
      - name: Build
        working-directory: android-agent
        run: |
          GRADLE_VERSION=8.11.1
          mkdir -p gradle/wrapper
          curl -sL https://raw.githubusercontent.com/gradle/gradle/v${GRADLE_VERSION}/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
          curl -sL https://raw.githubusercontent.com/gradle/gradle/v${GRADLE_VERSION}/gradlew -o gradlew
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace --no-daemon 2>&1
          mkdir -p release-assets
          cp app/build/outputs/apk/release/*.apk release-assets/Android-Use-v3.0.0.apk
          cd release-assets && sha256sum *.apk > SHA256SUMS.txt && ls -lh
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-use-apk
          path: android-agent/release-assets/*
          if-no-files-found: warn
      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.0
          name: Android-Use v3.0.0
          token: ${{ secrets.PAT_TOKEN }}
          body: |
            # Android-Use v3.0.0
            ## What's New
            - **Renamed** from TaskFlow to Android-Use
            - **Fixed background execution** — agent now runs properly in background
            - **Fixed text input** — 3 fallback strategies (ACTION_SET_TEXT, focus detection, clipboard paste)
            - **Fixed node ID matching** — correct hashCode-based lookup
            - **Faster agent loop** — cached system prompt, model retry with backoff
            - **Clean consumer UI** — no technical jargon, just actions and results
            - **Auto tool name correction** — 30+ aliases handled transparently
            
            ## Installation
            1. Download Android-Use-v3.0.0.apk
            2. Settings > Security > Enable install from browser/source
            3. Install the APK
            4. Open app > Enable Accessibility > Enter your API details
            
            ## Compatibility
            - Android 9+ (minSdk 28), optimized for Android 15 (targetSdk 35)
            - Works on all Android devices with Accessibility services
          files: android-agent/release-assets/*
          draft: false
          prerelease: false
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs
          path: android-agent/app/build/
          if-no-files-found: ignore
