name: Build & Release Android-Use APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v3
      - name: Build
        working-directory: android-agent
        run: |
          GRADLE_VERSION=8.11.1
          mkdir -p gradle/wrapper
          curl -sL https://raw.githubusercontent.com/gradle/gradle/v${GRADLE_VERSION}/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
          curl -sL https://raw.githubusercontent.com/gradle/gradle/v${GRADLE_VERSION}/gradlew -o gradlew
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace --no-daemon 2>&1
          mkdir -p release-assets
          cp app/build/outputs/apk/release/*.apk release-assets/Android-Use-v4.0.0.apk
          cd release-assets && sha256sum *.apk > SHA256SUMS.txt && ls -lh
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-use-apk
          path: android-agent/release-assets/*
          if-no-files-found: warn
      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.0.0
          name: Android-Use v4.0.0
          token: ${{ secrets.PAT_TOKEN }}
          body: |
            # Android-Use v4.0.0 — Manus-inspired Rewrite
            ## What's New
            - **Multi-turn conversation** — Full chat history sent to LLM for context continuity
            - **User memory** — Agent remembers facts about you across sessions
            - **Chat + Agent dual mode** — Auto-detects when to respond vs control device
            - **Continue chat** — Send follow-up messages without losing context
            - **New chat button** — Fresh start, memory preserved
            - **Manus-style UI** — "Android-Use is using mobile..." status pill with timer
            - **500 step limit** — Long tasks supported (WhatsApp conversations, etc.)
            - **No app close loops** — Agent instructed not to close/reopen apps unnecessarily
            - **Better loop recovery** — Different strategy instead of just warning
            - **Example prompts** — Empty state shows usage examples
            
            ## Installation
            1. Download Android-Use-v4.0.0.apk
            2. Settings > Security > Enable install from browser/source
            3. Install the APK
            4. Open app > Enable Accessibility > Enter your API details
            
            ## Compatibility
            - Android 9+ (minSdk 28), optimized for Android 15 (targetSdk 35)
          files: android-agent/release-assets/*
          draft: false
          prerelease: false
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs
          path: android-agent/app/build/
          if-no-files-found: ignore
