name: Build & Release Android-Use APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v3
      - name: Build
        working-directory: android-agent
        run: |
          GRADLE_VERSION=8.11.1
          mkdir -p gradle/wrapper
          curl -sL https://raw.githubusercontent.com/gradle/gradle/v${GRADLE_VERSION}/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
          curl -sL https://raw.githubusercontent.com/gradle/gradle/v${GRADLE_VERSION}/gradlew -o gradlew
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace --no-daemon 2>&1
          mkdir -p release-assets
          cp app/build/outputs/apk/release/*.apk release-assets/Android-Use-v4.2.0.apk
          cd release-assets && sha256sum *.apk > SHA256SUMS.txt && ls -lh
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-use-apk
          path: android-agent/release-assets/*
          if-no-files-found: warn
      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.2.0
          name: Android-Use v4.2.0
          token: ${{ secrets.PAT_TOKEN }}
          body: |
            # Android-Use v4.2.0 — UI Overhaul & Fixes
            
            ## What's New
            - **Complete UI redesign** — Polished mobile-first design with proper spacing, colors, and components
            - **App icon** — New AI robot icon (raster + adaptive, works on all devices)
            - **Default assistant overlay** — Appears on current display (not full screen), Gemini-style bottom panel
            - **Clickable suggestions** — Empty state chips now actually send tasks
            - **Agent chat avatar** — Agent messages show robot avatar icon
            - **Better Settings UI** — Section headers with icons, proper grouping, styled components
            - **Accessibility banner** — Proper FilledTonalButton for enable action
            - **Number typing retry** — If text verification fails, auto-clears and retries via clipboard
            - **Stronger prompt** — Better number accuracy instructions for the AI model
            
            ## Bug Fixes
            - Fixed: White square icon (broken vector drawable replaced with proper icon)
            - Fixed: Default assistant opening full screen (now bottom overlay panel)
            - Fixed: Suggestion chips not clickable
            - Fixed: Wrong regex in extractJsonField
            - Fixed: TypeTextTool 'val val' compile error
            - Removed: Incorrect meta-data from AssistActivity manifest
            
            ## Installation
            1. Download Android-Use-v4.2.0.apk
            2. Settings > Security > Enable install from browser/source
            3. Install the APK
            4. Open app > Enable Accessibility > Enter your API details
            5. (Optional) Set as default assistant: Settings > Apps > Default Digital Assistant > Android-Use
            6. (Optional) Enable floating ball: Settings > Apps > Android-Use > Special access > Display over other apps
            
            ## Compatibility
            - Android 9+ (minSdk 28), optimized for Android 15 (targetSdk 35)
          files: android-agent/release-assets/*
          draft: false
          prerelease: false
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs
          path: android-agent/app/build/
          if-no-files-found: ignore
