name: Build & Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle Wrapper
        run: |
          GRADLE_VERSION=8.11.1
          mkdir -p gradle/wrapper
          curl -sL https://raw.githubusercontent.com/gradle/gradle/v${GRADLE_VERSION}/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
          curl -sL https://raw.githubusercontent.com/gradle/gradle/v${GRADLE_VERSION}/gradlew -o gradlew
          chmod +x gradlew

      - name: Generate Release Keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore app/release.keystore \
            -alias taskflow \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass taskflow2025 \
            -keypass taskflow2025 \
            -dname "CN=TaskFlow, OU=Development, O=TaskFlow, L=Unknown, ST=Unknown, C=US"

      - name: Build Release APK
        env:
          KEYSTORE_PATH: release.keystore
          KEYSTORE_PASSWORD: taskflow2025
          KEY_ALIAS: taskflow
          KEY_PASSWORD: taskflow2025
        run: ./gradlew assembleRelease --stacktrace --no-daemon 2>&1

      - name: Verify APK Signing
        run: |
          APK=$(find app/build/outputs/apk/release/ -name "*.apk" | head -1)
          echo "APK: $APK"
          ls -lh "$APK"
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools/ | tail -1)/apksigner verify --print-certs "$APK"

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/release/*.apk release-assets/TaskFlow-v1.0.3.apk
          cd release-assets
          sha256sum *.apk > SHA256SUMS.txt
          echo "--- Release Assets ---"
          ls -lh
          cat SHA256SUMS.txt

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: taskflow-apk
          path: release-assets/*
          if-no-files-found: warn

      - name: Delete old release
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          gh release delete v1.0.3 --yes 2>/dev/null || true
          git tag -d v1.0.3 2>/dev/null || true
          git push origin :refs/tags/v1.0.3 2>/dev/null || true

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.3
          name: TaskFlow v1.0.3
          token: ${{ secrets.PAT_TOKEN }}
          body: |
            # TaskFlow v1.0.3

            A productivity task automation app for Android.

            ## Features
            - 21+ automation tools (tap, scroll, swipe, type, launch apps, screenshots)
            - AI-powered task understanding
            - Screen control service for UI automation
            - Dark Material 3 theme
            - Task history, safety controls, emergency stop
            - Encrypted settings storage
            - Works on all architectures (arm64-v8a, armeabi-v7a, x86_64)

            ## Installation Instructions (Important!)

            ### Step 1: Allow installation from your browser
            - Go to **Settings** > **Password & security** > **Install unknown apps**
            - Find your browser (Chrome/Edge/Firefox) and **enable** it

            ### Step 2: Disable Play Protect scanning (temporary)
            - Open **Google Play Store** app
            - Tap your **profile icon** (top right)
            - Tap **Play Protect**
            - Tap the **gear icon** (top right)
            - **Turn OFF** both:
              - "Scan apps with Play Protect"
              - "Improve harmful app detection"

            ### Step 3: Install the APK
            - Download `TaskFlow-v1.0.3.apk`
            - Tap the downloaded file to install
            - If you see a warning, tap **"Install anyway"** or **"More details" > "Install anyway"**

            ### Step 4: Re-enable Play Protect (recommended)
            - Go back to Play Protect settings and turn scanning back ON

            ### Step 5: Enable Screen Control
            - Open TaskFlow
            - Go to **Settings** > Enable **Screen Control Service**
            - This allows the app to read screen content and perform actions

            ## Compatibility
            - Android 9+ (minSdk 28), fully compatible with Android 15 (targetSdk 35)
            - Tested on OPPO A3 Pro 5G (ColorOS 15.0)

            ## Files
            - `TaskFlow-v1.0.3.apk` — Universal release (works on all devices)
            - `SHA256SUMS.txt` — Verify download integrity
          files: release-assets/*
          draft: false
          prerelease: false

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs
          path: |
            app/build/
          if-no-files-found: ignore
