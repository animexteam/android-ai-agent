name: Build & Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle Wrapper
        run: |
          GRADLE_VERSION=8.11.1
          mkdir -p gradle/wrapper
          curl -sL https://raw.githubusercontent.com/gradle/gradle/v${GRADLE_VERSION}/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
          curl -sL https://raw.githubusercontent.com/gradle/gradle/v${GRADLE_VERSION}/gradlew -o gradlew
          chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon 2>&1

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/release/*.apk release-assets/android-agent-universal-release.apk
          cd release-assets
          sha256sum *.apk > SHA256SUMS.txt
          echo "--- Release Assets ---"
          ls -lh
          cat SHA256SUMS.txt

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-agent-apk
          path: release-assets/*
          if-no-files-found: warn

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.2
          name: Android AI Agent v1.0.2
          body: |
            # Android AI Agent v1.0.2

            Native Android AI Computer-Use Agent powered by Gemma 4 31B.

            ## Features
            - 21+ automation tools (click, scroll, swipe, type, launch apps, screenshots)
            - Ollama Cloud API with multimodal vision
            - Accessibility Service based UI automation
            - Dark Material 3 theme
            - Task history, safety controls, emergency stop
            - Encrypted API key storage

            ## Installation
            1. Download `android-agent-universal-release.apk`
            2. Settings > Security > Enable "Install from unknown sources"
            3. Install and open the app
            4. Enable Accessibility Service when prompted
            5. Enter your Ollama API key in Settings

            ## Compatibility
            - Android 9+ (minSdk 28), fully compatible with Android 15 (targetSdk 35)

            ## Files
            - `android-agent-universal-release.apk` — Recommended (works on all devices)
            - `SHA256SUMS.txt` — Verify download integrity
          files: release-assets/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs
          path: |
            app/build/
          if-no-files-found: ignore
