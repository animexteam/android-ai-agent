name: Build & Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v3
      - name: Build
        run: |
          cd android-agent
          GRADLE_VERSION=8.11.1
          mkdir -p gradle/wrapper
          curl -sL https://raw.githubusercontent.com/gradle/gradle/v${GRADLE_VERSION}/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
          curl -sL https://raw.githubusercontent.com/gradle/gradle/v${GRADLE_VERSION}/gradlew -o gradlew
          chmod +x gradlew
          keytool -genkeypair -v -keystore app/release.keystore -alias taskflow -keyalg RSA -keysize 2048 -validity 10000 -storepass taskflow2025 -keypass taskflow2025 -dname "CN=TaskFlow,OU=Dev,O=TaskFlow,L=Unknown,ST=Unknown,C=US"
          ./gradlew assembleRelease --stacktrace --no-daemon 2>&1
          mkdir -p release-assets
          cp app/build/outputs/apk/release/*.apk release-assets/TaskFlow-v2.0.0.apk
          cd release-assets && sha256sum *.apk > SHA256SUMS.txt && ls -lh
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: taskflow-apk
          path: android-agent/release-assets/*
          if-no-files-found: warn
      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          name: TaskFlow v2.0.0
          token: ${{ secrets.PAT_TOKEN }}
          body: |
            # TaskFlow v2.0.0
            ## Installation (OPPO/ColorOS)
            1. Settings > Password & security > Install unknown apps > Enable your browser
            2. Play Store > Profile > Play Protect > Gear > Turn OFF scanning temporarily
            3. Download TaskFlow-v2.0.0.apk and install
            4. Re-enable Play Protect after install
            5. Open app > Enable Screen Control Service > Enter API key
            ## Compatibility
            - Android 9+ (minSdk 28), Android 15 (targetSdk 35)
            - Tested on OPPO A3 Pro 5G (ColorOS 15.0)
          files: android-agent/release-assets/*
          draft: false
          prerelease: false
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs
          path: android-agent/app/build/
          if-no-files-found: ignore
