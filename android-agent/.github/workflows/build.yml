name: Build & Release Android-Use APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-agent

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Generate Gradle Wrapper
        working-directory: android-agent
        run: |
          gradle wrapper --gradle-version 8.11.1
          chmod +x gradlew

      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v \
            -keystore app/release.keystore \
            -alias taskflow \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass taskflow2025 -keypass taskflow2025 \
            -dname "CN=AndroidUse, OU=Dev, O=AndroidUse, L=Unknown, ST=Unknown, C=US"

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon 2>&1

      - name: Verify APK
        run: |
          APK=$(find app/build/outputs/apk/release/ -name "*.apk" | head -1)
          echo "APK_PATH=$APK" >> $GITHUB_ENV
          echo "APK: $APK"
          ls -lh "$APK"

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/release/*.apk release-assets/Android-Use-v4.4.0.apk
          cd release-assets
          sha256sum *.apk > SHA256SUMS.txt
          ls -lh

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-use-apk
          path: android-agent/release-assets/*
          if-no-files-found: warn

      - name: Delete old release
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          gh release delete v4.4.0 --yes 2>/dev/null || true
          git tag -d v4.4.0 2>/dev/null || true
          git push origin :refs/tags/v4.4.0 2>/dev/null || true

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.4.0
          name: Android-Use v4.4.0
          token: ${{ secrets.PAT_TOKEN }}
          body: |
            # Android-Use v4.4.0

            AI-powered Android automation agent with 44 tools, provider settings, monochrome UI.

            ## What's New
            - **Settings: Cloud Model Provider dropdown** — Ollama, OpenAI, Groq, OpenRouter, Together AI, DeepInfra, Fireworks, Cerebras, Custom
            - **6 New Tools** (44 total): GetAppList, ForceStopApp, OpenAppInfo, ToggleWifi, ToggleBluetooth, SetBrightness, ScreenshotSave
            - **TBH-style dark monochrome UI** — polished settings, provider auto-fill

            ## Install
            1. Download `Android-Use-v4.4.0.apk`
            2. Enable "Install unknown apps" for your browser
            3. Install the APK
            4. Open app > Settings > Configure provider, API key, model
            5. Enable Accessibility Service

            ## Compatibility
            - Android 9+ (minSdk 28), targetSdk 35
          files: android-agent/release-assets/*
          draft: false
          prerelease: false

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs
          path: android-agent/app/build/
          if-no-files-found: ignore
